# Local Jenkins controller for the Terraform pipeline.
#   export JENKINS_ADMIN_PASSWORD=... REPO_URL=https://github.com/<you>/<repo>.git TF_STATE_BUCKET=...
#   docker compose up -d --build
# No Docker socket is mounted: the pipeline only needs the CLIs baked in the image.
services:
  jenkins:
    build: .
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?set JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL:?set REPO_URL to your fork of this repository}
      TF_STATE_BUCKET: ${TF_STATE_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      JENKINS_URL: http://localhost:${JENKINS_PORT:-8080}/
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins_home:
