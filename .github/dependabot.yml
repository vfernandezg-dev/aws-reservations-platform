version: 2

updates:
  - package-ecosystem: terraform
    directories:
      - /infrastructure
      - /bootstrap
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /app
      - /ci-cd/jenkins
    schedule:
      interval: weekly
