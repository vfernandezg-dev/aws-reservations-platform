name: Terraform apply

# Manual, environment-gated deployments:
#   1. plan   - read-only role, publishes the plan in the job summary
#   2. apply  - runs only after the GitHub Environment's required reviewers
#               approve, assumes the apply role and applies the exact saved plan
#   3. smoke  - end-to-end checks against the deployed environment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        description: apply or destroy
        type: choice
        options: [apply, destroy]
        default: apply
      app_image_tag:
        description: Image tag to deploy (empty = keep the currently deployed tag)
        type: string
        required: false
      confirm:
        description: For destroy, type the environment name to confirm
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan ${{ inputs.action }} (${{ inputs.environment }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - name: Guard destroy
        if: inputs.action == 'destroy' && inputs.confirm != inputs.environment
        working-directory: .
        run: |
          echo "::error::Destroy requires confirm='${{ inputs.environment }}'."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/${{ inputs.environment }}.s3.tfbackend" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        env:
          INPUT_TAG: ${{ inputs.app_image_tag }}
        run: |
          tag="${INPUT_TAG:-$(terraform output -raw app_image_tag 2>/dev/null || echo "${GITHUB_SHA}")}"
          destroy_flag=""
          if [ "${{ inputs.action }}" = "destroy" ]; then destroy_flag="-destroy"; fi
          terraform plan -no-color -lock-timeout=5m ${destroy_flag} \
            -var-file="environments/${{ inputs.environment }}.tfvars" \
            -var="app_image_tag=${tag}" \
            -out=tfplan | tee plan.txt
          {
            echo "### ${{ inputs.action }} plan · \`${{ inputs.environment }}\` · image \`${tag}\`"
            echo '```hcl'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The saved plan may contain sensitive values: keep it for one day only.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infrastructure/tfplan
          retention-days: 1

  apply:
    name: ${{ inputs.action }} (${{ inputs.environment }})
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }} # required reviewers approve here
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/${{ inputs.environment }}.s3.tfbackend" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.environment }}
          path: infrastructure

      - name: Apply the reviewed plan
        run: terraform apply -no-color -lock-timeout=5m tfplan

      - name: Smoke test
        if: inputs.action == 'apply'
        working-directory: .
        run: scripts/smoke-test.sh "${{ inputs.environment }}"
