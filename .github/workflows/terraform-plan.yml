name: Terraform plan

# Speculative plan on pull requests, posted as a sticky PR comment.
# Runs only when the AWS integration is configured (repository variables from
# the bootstrap stack output `github_actions_variables`).
on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    name: Plan (${{ matrix.environment }})
    if: vars.AWS_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC to AWS
      pull-requests: write # sticky plan comment
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init \
            -backend-config="environments/${{ matrix.environment }}.s3.tfbackend" \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Plan
        id: plan
        run: |
          # Keep the image that is currently deployed; fall back to this commit.
          tag="$(terraform output -raw app_image_tag 2>/dev/null || echo "${GITHUB_SHA}")"
          set +e
          terraform plan -no-color -lock-timeout=5m \
            -var-file="environments/${{ matrix.environment }}.tfvars" \
            -var="app_image_tag=${tag}" \
            -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          cat plan.log
          echo "exitcode=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi
          terraform show -no-color tfplan > plan.txt

      - name: Comment plan on the pull request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          EXIT_CODE: ${{ steps.plan.outputs.exitcode }}
        with:
          script: |
            const fs = require("fs");
            const env = process.env.ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            const changes = process.env.EXIT_CODE === "2";
            let plan = fs.readFileSync("infrastructure/plan.txt", "utf8");
            const summary = (plan.match(/^Plan: .*$/m) || ["No changes."])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + "\n... (truncated, see the job log)";
            const body = [
              marker,
              `### Terraform plan · \`${env}\` ${changes ? "🟡 changes" : "🟢 no changes"}`,
              `**${summary}**`,
              "<details><summary>Show plan</summary>",
              "",
              "```hcl",
              plan,
              "```",
              "</details>",
              "",
              `_Triggered by @${context.actor} · ${context.sha.slice(0, 7)}_`,
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
