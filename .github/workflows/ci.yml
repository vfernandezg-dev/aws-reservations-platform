name: CI

# Static quality gates for every change. No AWS credentials are needed:
# Terraform runs without a backend and the tests use a mocked provider.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  TFLINT_VERSION: "v0.66.0"
  CHECKOV_IMAGE: bridgecrew/checkov:3.4.5
  TFDOCS_IMAGE: quay.io/terraform-docs/terraform-docs:0.25.1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform fmt · validate · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Validate and unit-test infrastructure
        working-directory: infrastructure
        run: |
          terraform init -backend=false
          terraform validate
          terraform test

      - name: Validate bootstrap
        working-directory: bootstrap
        run: |
          terraform init -backend=false
          terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when downloading plugins
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: Security scan (Trivy · Checkov)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload SARIF to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy misconfiguration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: "true"
          exit-code: "1"

      - name: Upload Trivy results to code scanning
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif
          category: trivy-iac

      # Same pinned image as `make sec`, so local and CI results match.
      - name: Checkov (infrastructure, production settings)
        run: |
          docker run --rm -v "$PWD:/src" "$CHECKOV_IMAGE" \
            --config-file /src/.checkov.yaml \
            -d /src/infrastructure \
            --var-file /src/infrastructure/environments/prod.tfvars

      - name: Checkov (bootstrap)
        run: |
          docker run --rm -v "$PWD:/src" "$CHECKOV_IMAGE" \
            --config-file /src/.checkov.yaml \
            -d /src/bootstrap

  docs:
    name: terraform-docs up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned terraform-docs version as `make docs`; fails if any README is stale.
      - name: Regenerate module documentation
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$TFDOCS_IMAGE" \
            -c .terraform-docs.yml --recursive --recursive-path modules infrastructure
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/src" -w /src "$TFDOCS_IMAGE" \
            -c .terraform-docs.yml bootstrap

      - name: Fail if documentation is out of date
        run: git diff --exit-code -- '*.md' || { echo "::error::Run 'make docs' and commit the result."; exit 1; }

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  scripts:
    name: Dockerfile & shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint (app image)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile

      - name: Hadolint (Jenkins controller image)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ci-cd/jenkins/Dockerfile

      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
