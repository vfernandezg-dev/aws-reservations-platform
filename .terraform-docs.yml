# terraform-docs configuration (`make docs`). The infrastructure stack is run
# with --recursive so every module under modules/ is documented too.
# Generates the Inputs/Outputs sections of every README.md between the
# BEGIN_TF_DOCS / END_TF_DOCS markers; the hand-written text around them is kept.
formatter: markdown table

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: true
  default: true
  escape: true
  hide-empty: true
  html: true
  indent: 3
  lockfile: false
  required: true
  sensitive: true
  type: true
