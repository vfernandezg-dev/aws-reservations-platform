# Local development: PostgreSQL 18 + the API, mirroring the RDS for PostgreSQL 18 setup.
#   docker compose up --build
#   docker compose run --rm migrate
#   curl localhost:8080/api/public/db-health
# Busy host ports? Override them: API_PORT=18080 DB_HOST_PORT=15432
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: reservations
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d reservations"]
      interval: 5s
      retries: 20

  api: &api
    build: .
    environment:
      PORT: "8080"
      APP_VERSION: local
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: reservations
      DB_USER: app
      DB_PASSWORD: local-dev-only
      DB_TLS: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  migrate:
    <<: *api
    command: ["dist/migrate.js"]
    ports: []
    profiles: ["tools"]
